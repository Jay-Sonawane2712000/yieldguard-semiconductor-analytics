project:
  name: YieldGuard
  random_seed: 2712000

data:
  dataset_id: 179
  source_url: https://archive.ics.uci.edu/static/public/179/secom.zip
  landing_archive: data/raw/secom.zip
  measurement_file: data/raw/secom.data
  label_file: data/raw/secom_labels.data
  names_file: data/raw/secom.names
  timestamp_format: "%d/%m/%Y %H:%M:%S"
  pass_label: -1
  failure_label: 1
  source_version: "uci-secom-179"

quality:
  max_missing_fraction: 0.40
  min_non_null_count: 100
  near_constant_dominant_fraction: 0.995
  min_reference_variance: 1.0e-12
  temporal_bin_count: 10
  min_temporal_coverage_fraction: 0.80
  extreme_iqr_multiplier: 3.0

evaluation:
  preferred_train_fraction: 0.60
  preferred_calibration_fraction: 0.20
  minimum_calibration_failures: 10
  minimum_final_failures: 10
  candidate_allocations:
    - [0.60, 0.20, 0.20]
    - [0.65, 0.20, 0.15]
    - [0.70, 0.15, 0.15]
    - [0.70, 0.20, 0.10]

monitoring:
  target_measurement_count_min: 8
  target_measurement_count_max: 15
  target_measurement_count: 12
  selection_rule_version: monitoring-selection-v1
  ranking_percentile_tie_method: average
  maximum_pairwise_absolute_correlation: 0.90
  imr_limit_version: imr-reference-v1
  imr_d2: 1.128
  imr_d4: 3.267
  ewma_lambda: 0.20
  ewma_l: 3.0
  ewma_limit_version: ewma-reference-time-varying-v1
  ewma_limit_form: time_varying

pca:
  model_version: pca-reference-v1
  threshold_version: pca-empirical-reference-q99-v1
  explained_variance_target: 0.90
  threshold_quantile: 0.99
  pca_contribution_top_k: 10

phase4:
  design_version: phase4-development-v1
  selection_metric: pr_auc
  calibration_method: raw_probability_no_recalibration
  calibration_bins: 5
  association_method_version: development-association-v1
  association_bootstrap_replicates: 250
  evaluation_bootstrap_replicates: 1000
  significance_alpha: 0.05
  percentage_budgets: [0.01, 0.05, 0.10, 0.20]
  fixed_top_k_budgets: [25, 50]
  logistic_configurations:
    - {id: logistic-c001, c: 0.01, penalty: l2}
    - {id: logistic-c010, c: 0.10, penalty: l2}
    - {id: logistic-c100, c: 1.00, penalty: l2}
    - {id: logistic-c1000, c: 10.00, penalty: l2}
  hist_gradient_boosting_configurations:
    - {id: hgb-01, learning_rate: 0.03, max_iter: 100, max_leaf_nodes: 7, min_samples_leaf: 20, l2_regularization: 1.0}
    - {id: hgb-02, learning_rate: 0.05, max_iter: 150, max_leaf_nodes: 7, min_samples_leaf: 15, l2_regularization: 1.0}
    - {id: hgb-03, learning_rate: 0.05, max_iter: 150, max_leaf_nodes: 15, min_samples_leaf: 20, l2_regularization: 2.0}
    - {id: hgb-04, learning_rate: 0.08, max_iter: 100, max_leaf_nodes: 15, min_samples_leaf: 15, l2_regularization: 2.0}

outputs:
  database: data/processed/yieldguard.duckdb
  phase1_directory: data/processed/phase1
